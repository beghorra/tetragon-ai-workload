---
# =============================================================================
# scenarios/ai-workload/tracing-policy.yaml -- OBSERVE (cluster-wide, OSS)
#
# Verbatim port of scenarios/ai-workload/tracing-policy.yaml's kprobe design.
# Every field used below (TracingPolicy kind, kprobes[], matchArgs/matchActions,
# Prefix/In operators, Post action) is a documented core OSS
# cilium.io/v1alpha1 CRD field (tetragon.io/docs/reference/tracing-policy/) --
# nothing here depends on Isovalent Enterprise. Confirmed live against
# quay.io/cilium/tetragon:v1.7.0 on <your-k3s-host>.
#
# "Guard the Model." One compromised AI agent backed by an MCP tool server, one
# continuous intrusion in six MCP tool calls, scoped by podSelector to the MCP
# tool server pod (app: ai-inference) wherever it runs (now ai-workload-oss ns).
# Every selector uses action: Post -- nothing is stopped here. The paired
# enforce policy (enforce-policy.yaml) and the microsegmentation policy
# (network-policy.yaml) break the chain link-by-link.
#
# HOOK CHOICES (unchanged from the Enterprise-lab design):
#   security_bprm_check -> execution: the MCP execute tool spawning a shell or
#                          a downloader (prompt-injection / tool-chaining abuse).
#   fd_install          -> credential + crown-jewel access: the MCP read_file
#                          tool dispatching cat to read the API secret or model
#                          weights.
#   tcp_v4_connect      -> egress: the MCP fetch tool exfilling weights via
#                          python urllib, and nc C2 via execute tool.
#
# LINK -> MITRE mapping:
#   1 execute -> sh shell-out (prompt-injection foothold)   T1059.004 / T1059
#   2 execute -> sh downloader (tool-chaining abuse)        T1059 / T1204
#   3 read_file -> inference API secret                     T1552
#   4 read_file -> model weights (crown jewel)               T1005
#   5 fetch -> python urllib egress (weights walk-out)      T1041
#   6 execute -> nc C2 beacon                                T1071.001
#
# WHAT'S DIFFERENT FROM ai-workload: every one of these MCP tool calls now
# arrives over the REAL pod network (agent-driver.ai-agent-oss ->
# ai-inference.ai-workload-oss), not kubectl-exec loopback -- so links 5/6's
# connect() attempts AND the agent->tool-server call itself are both visible to
# Hubble/Cilium flow tooling, not just the process-level kprobes below.
# =============================================================================
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ai-workload-oss-observe
  annotations:
    scenario: ai-workload-oss
    mitre: "T1059.004,T1059,T1204,T1552,T1005,T1041,T1071.001"
    description: "OSS Tetragon: observe a full compromise of an AI agent via MCP tool abuse (shell-out, credential theft, model-weights staging, exfil, C2)"
spec:
  podSelector:
    matchLabels:
      app: ai-inference
  kprobes:
    # -- Links 1-2: MCP execute tool -> sh shell-out / downloader ----------------
    - call: "security_bprm_check"
      syscall: false
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/bin/sh"
                - "/bin/bash"
                - "/bin/ash"
                - "/bin/dash"
                - "/usr/bin/sh"
                - "/usr/bin/bash"
                - "/bin/busybox"
          matchActions:
            - action: Post
    # -- Links 3-4: MCP read_file tool -> cat on the secret + model weights ------
    - call: "fd_install"
      syscall: false
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "file"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "/etc/ai/"
                - "/models/"
          matchBinaries:
            - operator: "In"
              values:
                - "/bin/busybox"
                - "/bin/cat"
                - "/usr/bin/cat"
                - "/usr/bin/head"
                - "/bin/nc"
                - "/usr/bin/nc"
          matchActions:
            - action: Post
    # -- Links 5-6: MCP fetch/execute tool -> python egress / nc C2 -------------
    - call: "tcp_v4_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
      selectors:
        - matchBinaries:
            - operator: "In"
              values:
                - "/bin/busybox"
                - "/usr/bin/nc"
                - "/bin/nc"
                - "/usr/bin/wget"
                - "/bin/wget"
                - "/bin/bash"
                - "/usr/bin/bash"
                - "/bin/sh"
                - "/usr/bin/sh"
                - "/usr/local/bin/python3.11"
                - "/usr/local/bin/python3"
          matchActions:
            - action: Post
